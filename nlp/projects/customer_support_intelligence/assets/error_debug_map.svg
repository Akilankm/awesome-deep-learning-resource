<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420"><rect width="100%" height="100%" fill="white"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Wrong Prediction → Engineering Debug Path</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs><rect x="35" y="110" rx="16" width="206" height="170" fill="#e3f2fd" stroke="#263238" stroke-width="2"/><text x="138" y="140" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">WRONG OUTPUT</text><text x="138" y="172" text-anchor="middle" font-family="Arial" font-size="14">start from an individual</text><text x="138" y="195" text-anchor="middle" font-family="Arial" font-size="14">failed ticket</text><line x1="241" y1="195" x2="261" y2="195" stroke="#455a64" stroke-width="3" marker-end="url(#a)"/><rect x="266" y="110" rx="16" width="206" height="170" fill="#e8f5e9" stroke="#263238" stroke-width="2"/><text x="369" y="140" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">LABEL?</text><text x="369" y="172" text-anchor="middle" font-family="Arial" font-size="14">is the target ambiguous,</text><text x="369" y="195" text-anchor="middle" font-family="Arial" font-size="14">multi-intent or</text><text x="369" y="218" text-anchor="middle" font-family="Arial" font-size="14">inconsistent?</text><line x1="472" y1="195" x2="492" y2="195" stroke="#455a64" stroke-width="3" marker-end="url(#a)"/><rect x="497" y="110" rx="16" width="206" height="170" fill="#fff8e1" stroke="#263238" stroke-width="2"/><text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">FEATURES?</text><text x="600" y="172" text-anchor="middle" font-family="Arial" font-size="14">did</text><text x="600" y="195" text-anchor="middle" font-family="Arial" font-size="14">normalization/vectorization</text><text x="600" y="218" text-anchor="middle" font-family="Arial" font-size="14">preserve the needed</text><text x="600" y="241" text-anchor="middle" font-family="Arial" font-size="14">evidence?</text><line x1="703" y1="195" x2="723" y2="195" stroke="#455a64" stroke-width="3" marker-end="url(#a)"/><rect x="728" y="110" rx="16" width="206" height="170" fill="#f3e5f5" stroke="#263238" stroke-width="2"/><text x="831" y="140" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">BOUNDARY?</text><text x="831" y="172" text-anchor="middle" font-family="Arial" font-size="14">does the classifier</text><text x="831" y="195" text-anchor="middle" font-family="Arial" font-size="14">weight the available</text><text x="831" y="218" text-anchor="middle" font-family="Arial" font-size="14">evidence correctly?</text><line x1="934" y1="195" x2="954" y2="195" stroke="#455a64" stroke-width="3" marker-end="url(#a)"/><rect x="959" y="110" rx="16" width="206" height="170" fill="#ffebee" stroke="#263238" stroke-width="2"/><text x="1062" y="140" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">POLICY?</text><text x="1062" y="172" text-anchor="middle" font-family="Arial" font-size="14">should this case be</text><text x="1062" y="195" text-anchor="middle" font-family="Arial" font-size="14">automated or deferred to</text><text x="1062" y="218" text-anchor="middle" font-family="Arial" font-size="14">human review?</text><text x="600" y="365" text-anchor="middle" font-family="Arial" font-size="15" fill="#546e7a">Do not respond to every error by adding model complexity. First identify which layer actually failed.</text></svg>