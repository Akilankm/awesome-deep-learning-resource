<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420"><rect width="100%" height="100%" fill="white"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Production NLP Is a Feedback System</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker></defs><rect x="35" y="110" rx="16" width="206" height="170" fill="#e3f2fd" stroke="#263238" stroke-width="2"/><text x="138" y="140" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">LIVE INPUT</text><text x="138" y="172" text-anchor="middle" font-family="Arial" font-size="14">new language, products,</text><text x="138" y="195" text-anchor="middle" font-family="Arial" font-size="14">users, channels and edge</text><text x="138" y="218" text-anchor="middle" font-family="Arial" font-size="14">cases</text><line x1="241" y1="195" x2="261" y2="195" stroke="#455a64" stroke-width="3" marker-end="url(#a)"/><rect x="266" y="110" rx="16" width="206" height="170" fill="#e8f5e9" stroke="#263238" stroke-width="2"/><text x="369" y="140" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">MODEL + RETRIEVAL</text><text x="369" y="172" text-anchor="middle" font-family="Arial" font-size="14">prediction, confidence,</text><text x="369" y="195" text-anchor="middle" font-family="Arial" font-size="14">entities and ranked</text><text x="369" y="218" text-anchor="middle" font-family="Arial" font-size="14">evidence</text><line x1="472" y1="195" x2="492" y2="195" stroke="#455a64" stroke-width="3" marker-end="url(#a)"/><rect x="497" y="110" rx="16" width="206" height="170" fill="#fff8e1" stroke="#263238" stroke-width="2"/><text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">OPERATIONS</text><text x="600" y="172" text-anchor="middle" font-family="Arial" font-size="14">automation vs human</text><text x="600" y="195" text-anchor="middle" font-family="Arial" font-size="14">review; latency and</text><text x="600" y="218" text-anchor="middle" font-family="Arial" font-size="14">business action</text><line x1="703" y1="195" x2="723" y2="195" stroke="#455a64" stroke-width="3" marker-end="url(#a)"/><rect x="728" y="110" rx="16" width="206" height="170" fill="#f3e5f5" stroke="#263238" stroke-width="2"/><text x="831" y="140" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">FEEDBACK</text><text x="831" y="172" text-anchor="middle" font-family="Arial" font-size="14">overrides, delayed</text><text x="831" y="195" text-anchor="middle" font-family="Arial" font-size="14">labels, error slices,</text><text x="831" y="218" text-anchor="middle" font-family="Arial" font-size="14">incidents</text><line x1="934" y1="195" x2="954" y2="195" stroke="#455a64" stroke-width="3" marker-end="url(#a)"/><rect x="959" y="110" rx="16" width="206" height="170" fill="#ffebee" stroke="#263238" stroke-width="2"/><text x="1062" y="140" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">DECISION</text><text x="1062" y="172" text-anchor="middle" font-family="Arial" font-size="14">do nothing, adjust</text><text x="1062" y="195" text-anchor="middle" font-family="Arial" font-size="14">policy, fix data, retrain</text><text x="1062" y="218" text-anchor="middle" font-family="Arial" font-size="14">or redesign</text><text x="600" y="365" text-anchor="middle" font-family="Arial" font-size="15" fill="#546e7a">Drift is an observation. Retraining is only one possible response.</text></svg>