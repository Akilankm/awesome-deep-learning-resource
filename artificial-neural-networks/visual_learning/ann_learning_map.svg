<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250"><style>.b{fill:#f5f7fb;stroke:#27496d;stroke-width:2}.t{font:18px Arial;fill:#102a43}.s{font:15px Arial;fill:#486581}.a{stroke:#27496d;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#27496d"/></marker></defs><text class="t" x="600" y="28" text-anchor="middle">ANN: data → representation → decision → learning</text><g><rect class="b" x="20" y="75" width="160" height="85" rx="12"/><text class="t" x="100" y="108" text-anchor="middle">Real input</text><text class="s" x="100" y="135" text-anchor="middle">pixels/features</text><rect class="b" x="220" y="75" width="165" height="85" rx="12"/><text class="t" x="302" y="108" text-anchor="middle">Forward pass</text><text class="s" x="302" y="135" text-anchor="middle">z → activation</text><rect class="b" x="425" y="75" width="155" height="85" rx="12"/><text class="t" x="502" y="108" text-anchor="middle">Prediction</text><text class="s" x="502" y="135" text-anchor="middle">score/probability</text><rect class="b" x="620" y="75" width="145" height="85" rx="12"/><text class="t" x="692" y="108" text-anchor="middle">Loss</text><text class="s" x="692" y="135" text-anchor="middle">how wrong?</text><rect class="b" x="805" y="75" width="165" height="85" rx="12"/><text class="t" x="887" y="108" text-anchor="middle">Backprop</text><text class="s" x="887" y="135" text-anchor="middle">sensitivities</text><rect class="b" x="1010" y="75" width="165" height="85" rx="12"/><text class="t" x="1092" y="108" text-anchor="middle">Update</text><text class="s" x="1092" y="135" text-anchor="middle">new geometry</text></g><line class="a" x1="180" y1="117" x2="220" y2="117"/><line class="a" x1="385" y1="117" x2="425" y2="117"/><line class="a" x1="580" y1="117" x2="620" y2="117"/><line class="a" x1="765" y1="117" x2="805" y2="117"/><line class="a" x1="970" y1="117" x2="1010" y2="117"/><path d="M1090 175 C1000 225, 350 225, 300 175" fill="none" class="a"/><text class="s" x="700" y="220" text-anchor="middle">repeat over samples/epochs: representation learning</text></svg>