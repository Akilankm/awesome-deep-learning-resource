<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><style>.n{fill:#eef4ff;stroke:#334e68;stroke-width:2}.t{font:17px Arial;fill:#102a43}.f{stroke:#2f6f9f;stroke-width:2.5;marker-end:url(#mf)}.b{stroke:#c25b42;stroke-width:2.5;marker-end:url(#mb)}</style><defs><marker id="mf" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f6f9f"/></marker><marker id="mb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c25b42"/></marker></defs><text class="t" x="500" y="28" text-anchor="middle">Values move forward; sensitivities move backward</text><circle class="n" cx="120" cy="135" r="45"/><text class="t" x="120" y="142" text-anchor="middle">x</text><circle class="n" cx="330" cy="135" r="52"/><text class="t" x="330" y="128" text-anchor="middle">z¹</text><text class="t" x="330" y="151" text-anchor="middle">a¹</text><circle class="n" cx="550" cy="135" r="52"/><text class="t" x="550" y="128" text-anchor="middle">z²</text><text class="t" x="550" y="151" text-anchor="middle">ŷ</text><circle class="n" cx="780" cy="135" r="48"/><text class="t" x="780" y="142" text-anchor="middle">Loss</text><line class="f" x1="165" y1="120" x2="278" y2="120"/><line class="f" x1="382" y1="120" x2="498" y2="120"/><line class="f" x1="602" y1="120" x2="732" y2="120"/><text class="t" x="450" y="78" text-anchor="middle">FORWARD: compute values</text><line class="b" x1="732" y1="190" x2="602" y2="190"/><line class="b" x1="498" y1="190" x2="382" y2="190"/><line class="b" x1="278" y1="190" x2="165" y2="190"/><text class="t" x="450" y="245" text-anchor="middle">BACKWARD: compute ∂Loss/∂(parameter)</text><text class="t" x="500" y="305" text-anchor="middle">optimizer: parameter ← parameter − learning_rate × gradient</text></svg>