name: Materialize RNN NLP sentence notebooks

on:
  push:
    branches: [master]
    paths:
      - "RNN/notebooks/15_text_sequences_for_rnn.ipynb"
      - "RNN/notebooks/16_sentence_classification_tensorflow.ipynb"
      - "RNN/projects/sentence_sentiment_classification/**"
      - ".github/workflows/materialize_rnn_sentence_nlp.yml"
  workflow_dispatch:

concurrency:
  group: materialize-rnn-sentence-nlp
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  execute-and-commit:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[materialized sentence nlp]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: RNN/environment.yml
          activate-environment: awesome-rnn
          auto-activate-base: false

      - name: Register notebook kernel
        shell: bash -el {0}
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Execute RNN NLP notebooks and project
        shell: bash -el {0}
        run: |
          python scripts/execute_notebooks.py             RNN/notebooks/15_text_sequences_for_rnn.ipynb             RNN/notebooks/16_sentence_classification_tensorflow.ipynb             RNN/projects/sentence_sentiment_classification/00_end_to_end_sentence_sentiment_rnn.ipynb             --report RNN/reports/sentence_nlp_execution_report.json

      - name: Verify repository notebooks
        shell: bash -el {0}
        run: python scripts/verify_notebooks.py

      - name: Commit executed notebooks and project artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             RNN/notebooks/15_text_sequences_for_rnn.ipynb             RNN/notebooks/16_sentence_classification_tensorflow.ipynb             RNN/projects/sentence_sentiment_classification             RNN/reports/sentence_nlp_execution_report.json             notebook_execution_report.json
          if git diff --cached --quiet; then
            echo "No materialized changes to commit."
          else
            git commit -m "Execute RNN NLP sentence classification [materialized sentence nlp]"
            git push origin HEAD:master
          fi
