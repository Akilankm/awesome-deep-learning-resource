name: Bootstrap RNN CNN curriculum
on:
  push:
    branches: [master]
    paths:
      - 'scripts/build_rnn_cnn_curriculum.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-execute-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          activate-environment: curriculum-bootstrap
          auto-activate-base: false
      - name: Install bootstrap dependencies with Conda
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge numpy pandas scipy scikit-learn matplotlib plotly ipywidgets jupyterlab notebook ipykernel nbformat nbclient nbconvert pyarrow tqdm pip
          pip install 'tensorflow==2.20.*'
          python -m ipykernel install --user --name python3 --display-name 'Python 3'
      - name: Generate curriculum source tree
        shell: bash -el {0}
        run: python scripts/build_rnn_cnn_curriculum.py
      - name: Execute RNN notebooks
        shell: bash -el {0}
        run: python RNN/scripts/execute_notebooks.py RNN
      - name: Verify RNN outputs
        shell: bash -el {0}
        run: python RNN/scripts/verify_notebooks.py RNN
      - name: Execute CNN notebooks
        shell: bash -el {0}
        run: python CNN/scripts/execute_notebooks.py CNN
      - name: Verify CNN outputs
        shell: bash -el {0}
        run: python CNN/scripts/verify_notebooks.py CNN
      - name: Commit generated executed curriculum
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md RNN CNN .github/workflows/rnn_cnn_notebooks.yml
          git commit -m 'Add executed TensorFlow RNN and CNN learning tracks'
          git push origin master
