name: Validate ANN notebooks

on:
  push:
    paths:
      - 'artificial-neural-networks/**'
      - '.github/workflows/validate-ann-notebooks.yml'
  pull_request:
    paths:
      - 'artificial-neural-networks/**'
      - '.github/workflows/validate-ann-notebooks.yml'

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r artificial-neural-networks/requirements.txt
          pip install nbconvert

      - name: Validate notebook Markdown
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          for path in sorted(Path('artificial-neural-networks').glob('*.ipynb')):
              notebook = json.loads(path.read_text(encoding='utf-8'))
              for index, cell in enumerate(notebook.get('cells', [])):
                  if cell.get('cell_type') != 'markdown':
                      continue
                  source = ''.join(cell.get('source', []))
                  # GitHub/Jupyter are most consistent when Markdown math uses
                  # $...$ and $$...$$ instead of LaTeX-only \(...\) / \[...\].
                  if '\\(' in source or '\\)' in source or '\\[' in source or '\\]' in source:
                      failures.append(f'{path}: markdown cell {index} uses renderer-fragile math delimiters')

          if failures:
              raise SystemExit('\n'.join(failures))

          print('Markdown validation passed for every ANN notebook.')
          PY

      - name: Execute every ANN notebook
        run: |
          set -euo pipefail
          mkdir -p executed-notebooks
          for notebook in artificial-neural-networks/*.ipynb; do
            echo "Executing ${notebook}"
            jupyter nbconvert \
              --to notebook \
              --execute "${notebook}" \
              --ExecutePreprocessor.timeout=180 \
              --output-dir executed-notebooks
          done

      - name: Upload executed notebooks
        uses: actions/upload-artifact@v4
        with:
          name: executed-ann-notebooks
          path: executed-notebooks/*.ipynb
          if-no-files-found: error
