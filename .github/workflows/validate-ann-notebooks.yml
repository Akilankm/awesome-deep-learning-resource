name: ANN notebooks — execute and verify

on:
  push:
    paths:
      - 'artificial-neural-networks/**'
      - 'scripts/**'
      - '.github/workflows/validate-ann-notebooks.yml'
  pull_request:
    paths:
      - 'artificial-neural-networks/**'
      - 'scripts/**'
      - '.github/workflows/validate-ann-notebooks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: artificial-neural-networks/requirements-notebook.txt

      - name: Install notebook environment
        run: |
          python -m pip install --upgrade pip
          pip install -r artificial-neural-networks/requirements-notebook.txt
          # CPU-only Torch avoids multi-GB CUDA dependencies on CI runners.
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"

      - name: Bootstrap canonical notebook source
        run: python scripts/bootstrap_ann_notebooks.py

      - name: Validate notebook source
        run: python scripts/validate_notebooks.py

      - name: Execute every notebook in place
        env:
          CI: 'true'
          MPLBACKEND: module://matplotlib_inline.backend_inline
        run: python scripts/execute_notebooks.py --in-place

      - name: Validate committed-style outputs
        run: python scripts/validate_notebooks.py --require-executed

      - name: Upload executed notebooks for inspection
        uses: actions/upload-artifact@v4
        with:
          name: executed-ann-notebooks
          path: artificial-neural-networks/*.ipynb
          if-no-files-found: error

      - name: Commit rendered outputs back to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/visual-ann-learning-track'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain artificial-neural-networks)" ]]; then
            git add -A artificial-neural-networks
            git commit -m "ci: refresh executed ANN notebook outputs"
            git push origin HEAD:feat/visual-ann-learning-track
          else
            echo "Executed notebooks already match committed outputs."
          fi
