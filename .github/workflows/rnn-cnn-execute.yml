name: Validate TensorFlow RNN and CNN curriculum

on:
  push:
    branches: [master]
    paths:
      - "RNN/**"
      - "CNN/**"
      - "scripts/execute_notebooks.py"
      - "scripts/verify_notebooks.py"
      - ".github/workflows/rnn-cnn-execute.yml"
  pull_request:
    paths:
      - "RNN/**"
      - "CNN/**"
      - "scripts/execute_notebooks.py"
      - "scripts/verify_notebooks.py"
      - ".github/workflows/rnn-cnn-execute.yml"
  workflow_dispatch:

jobs:
  rnn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: RNN/environment.yml
          activate-environment: awesome-rnn
          auto-activate-base: false
      - name: Register kernel
        shell: bash -el {0}
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Execute RNN curriculum
        shell: bash -el {0}
        run: python scripts/execute_notebooks.py RNN/notebooks RNN/projects --report RNN/reports/ci_execution_report.json
      - name: Verify all notebook outputs
        shell: bash -el {0}
        run: python scripts/verify_notebooks.py

  cnn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: CNN/environment.yml
          activate-environment: awesome-cnn
          auto-activate-base: false
      - name: Register kernel
        shell: bash -el {0}
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Execute CNN curriculum
        shell: bash -el {0}
        run: python scripts/execute_notebooks.py CNN/notebooks CNN/projects --report CNN/reports/ci_execution_report.json
      - name: Verify all notebook outputs
        shell: bash -el {0}
        run: python scripts/verify_notebooks.py
