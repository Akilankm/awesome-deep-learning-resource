name: Execute and validate MNIST ANN curriculum

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notebooks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout orphan branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pinned notebook environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          FRAMEWORK=$(python -c "import json; print(json.load(open('track.json'))['framework'])")
          if [ "$FRAMEWORK" = "pytorch" ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          elif [ "$FRAMEWORK" = "tensorflow" ]; then
            pip install tensorflow-cpu==2.18.0
          else
            echo "Unsupported framework: $FRAMEWORK"
            exit 1
          fi
          python -m pip check

      - name: Print runtime versions
        run: |
          python --version
          python -c "import numpy, matplotlib, sklearn, nbformat; print('numpy',numpy.__version__); print('matplotlib',matplotlib.__version__); print('sklearn',sklearn.__version__); print('nbformat',nbformat.__version__)"
          FRAMEWORK=$(python -c "import json; print(json.load(open('track.json'))['framework'])")
          if [ "$FRAMEWORK" = "pytorch" ]; then python -c "import torch; print('torch',torch.__version__)"; fi
          if [ "$FRAMEWORK" = "tensorflow" ]; then python -c "import tensorflow as tf; print('tensorflow',tf.__version__)"; fi

      - name: Build canonical visible notebooks
        run: python scripts/build_curriculum.py

      - name: Execute every notebook from cleared outputs
        run: python scripts/execute_notebooks.py

      - name: Validate rendered notebook artifacts
        run: python scripts/validate_notebooks.py

      - name: Upload executed notebooks as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ github.ref_name }}-notebooks
          path: notebooks/*.ipynb

      - name: Commit executed notebooks with outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/*.ipynb
          if [[ -n "$(git status --porcelain notebooks/*.ipynb)" ]]; then
            git commit -m "ci: refresh executed ANN notebooks [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "Committed notebook outputs are already reproducible."
          fi
