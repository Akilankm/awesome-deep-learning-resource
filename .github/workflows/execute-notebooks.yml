name: Execute and validate MNIST notebooks

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notebooks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install notebook environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          FRAMEWORK=$(python -c "import json; print(json.load(open('track.json'))['framework'])")
          if [ "$FRAMEWORK" = "pytorch" ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          elif [ "$FRAMEWORK" = "tensorflow" ]; then
            pip install tensorflow-cpu==2.18.0
          fi

      - name: Generate canonical notebooks from the proven orphan-root builder
        run: |
          ROOT_COMMIT=$(git rev-list --max-parents=0 HEAD | head -n 1)
          echo "Using orphan root: $ROOT_COMMIT"
          git show "$ROOT_COMMIT:scripts/bootstrap_notebooks.py" > /tmp/bootstrap_notebooks.py
          python /tmp/bootstrap_notebooks.py

      - name: Enrich teaching explanations
        run: python scripts/enrich_notebooks.py

      - name: Execute every notebook from a cleared state
        run: python scripts/execute_notebooks.py

      - name: Validate rendered notebook artifacts
        run: python scripts/validate_notebooks.py

      - name: Organize rendered notebooks for GitHub browsing
        run: |
          mkdir -p notebooks
          rm -f notebooks/*.ipynb
          mv ./*.ipynb notebooks/

      - name: Upload rendered notebooks
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ github.ref_name }}-notebooks
          path: notebooks/*.ipynb

      - name: Commit rendered notebooks into notebooks/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A notebooks visual_learning || true
          if [[ -n "$(git status --porcelain notebooks visual_learning 2>/dev/null)" ]]; then
            git commit -m "ci: commit executed MNIST notebooks with outputs [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "Rendered notebooks already match committed artifacts."
          fi
