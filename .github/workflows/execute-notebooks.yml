name: Execute and validate final MNIST ANN curriculum

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notebooks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout orphan branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize canonical branch from pinned shared payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf README.md scripts notebooks visual_learning requirements.txt environment.yml Makefile .python-version .gitignore data artifacts
          mkdir -p /tmp/ann-final-payload
          PAYLOAD_COMMIT=b5bc444bb8f4eff8a4ae5450921e5147ee689429
          for n in 00 01 02 03 04 05; do
            curl -fsSL "https://raw.githubusercontent.com/Akilankm/awesome-deep-learning-resource/${PAYLOAD_COMMIT}/infrastructure/final_payload_parts/${n}.txt" -o "/tmp/ann-final-payload/${n}.txt"
          done
          cat /tmp/ann-final-payload/*.txt > /tmp/ann-final-payload/all.b64
          python - <<'PY'
          from pathlib import Path
          import base64, io, os, tarfile
          branch = os.environ['GITHUB_REF_NAME']
          text = Path('/tmp/ann-final-payload/all.b64').read_text()
          raw = base64.b64decode(text, validate=True)
          root = Path.cwd()
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as tf:
              prefix = branch + '/'
              members = [m for m in tf.getmembers() if m.name.startswith(prefix)]
              if not members:
                  raise SystemExit(f'No payload members for {branch}')
              for member in members:
                  member.name = member.name[len(prefix):]
                  if member.name:
                      tf.extract(member, root)
          print(f'Materialized {branch}: {len(members)} archive members')
          PY

      - name: Install pinned environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${GITHUB_REF_NAME}" == "ann-mnist-pytorch" ]]; then
            grep -v '^torch==' requirements.txt > /tmp/requirements-ci.txt
            pip install -r /tmp/requirements-ci.txt
            pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          else
            pip install -r requirements.txt
          fi
          pip install "black[jupyter]==24.10.0"

      - name: Enforce notebook self-containment and TensorFlow compatibility
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def source_text(cell):
              src = cell.get('source', '')
              return ''.join(src) if isinstance(src, list) else src

          def set_source(cell, text):
              cell['source'] = text.splitlines(keepends=True)

          model_definition = '''@tf.keras.utils.register_keras_serializable()
          class MNISTMLP(tf.keras.Model):
              def __init__(self, hidden=64, **kwargs):
                  super().__init__(**kwargs)
                  self.hidden = hidden
                  self.fc1 = tf.keras.layers.Dense(
                      hidden,
                      activation=None,
                      kernel_initializer="he_normal",
                  )
                  self.act = tf.keras.layers.ReLU()
                  self.fc2 = tf.keras.layers.Dense(
                      10,
                      activation=None,
                      kernel_initializer="glorot_uniform",
                  )

              def call(self, x, training=False):
                  z1 = self.fc1(x)
                  a1 = self.act(z1)
                  return self.fc2(a1)

              def get_config(self):
                  config = super().get_config()
                  config.update({"hidden": self.hidden})
                  return config
          '''
          model_definition = '\n'.join(line[10:] if line.startswith('          ') else line for line in model_definition.splitlines())

          changed_files = 0
          for path in sorted(Path('notebooks').glob('*.ipynb')):
              nb = json.loads(path.read_text())
              changed = False
              for cell in nb.get('cells', []):
                  if cell.get('cell_type') != 'code':
                      continue
                  src = source_text(cell)
                  new = src

                  if path.name == '01_mnist_data_provenance_eda_splits.ipynb' and 'import matplotlib.pyplot as plt' not in new:
                      lines = new.splitlines()
                      insert_at = next((i + 1 for i, line in enumerate(lines) if line.strip() == 'import numpy as np'), 0)
                      lines.insert(insert_at, 'import matplotlib.pyplot as plt')
                      new = '\n'.join(lines) + ('\n' if src.endswith('\n') else '')

                  new = new.replace(
                      'tf.argmax(logits, 1, output_type=tf.uint8) == yb',
                      'tf.argmax(logits, 1, output_type=tf.int64) == tf.cast(yb, tf.int64)',
                  )
                  new = new.replace(
                      'tf.argmax(logits, axis=1, output_type=tf.uint8) == yb',
                      'tf.argmax(logits, axis=1, output_type=tf.int64) == tf.cast(yb, tf.int64)',
                  )

                  if 'class MNISTMLP(tf.keras.Model):' in new and '@tf.keras.utils.register_keras_serializable()' not in new:
                      new = new.replace(
                          'class MNISTMLP(tf.keras.Model):',
                          '@tf.keras.utils.register_keras_serializable()\nclass MNISTMLP(tf.keras.Model):',
                      )
                  new = new.replace(
                      'def __init__(self, hidden=64):\n        super().__init__()',
                      'def __init__(self, hidden=64, **kwargs):\n        super().__init__(**kwargs)\n        self.hidden = hidden',
                  )

                  if path.name == '12_production_monitoring_drift_retraining_business.ipynb' and 'load_model' in new:
                      if 'class MNISTMLP(tf.keras.Model):' not in new:
                          new = new.replace(
                              'import tensorflow as tf\n',
                              'import tensorflow as tf\n\n' + model_definition + '\n\n',
                              1,
                          )
                      new = new.replace(
                          'tf.keras.models.load_model(ARTIFACT_DIR / "mnist_tensorflow_mlp.keras")',
                          'tf.keras.models.load_model(\n    ARTIFACT_DIR / "mnist_tensorflow_mlp.keras",\n    custom_objects={"MNISTMLP": MNISTMLP, "Custom>MNISTMLP": MNISTMLP},\n)',
                      )
                      new = new.replace(
                          "tf.keras.models.load_model(ARTIFACT_DIR / 'mnist_tensorflow_mlp.keras')",
                          'tf.keras.models.load_model(\n    ARTIFACT_DIR / "mnist_tensorflow_mlp.keras",\n    custom_objects={"MNISTMLP": MNISTMLP, "Custom>MNISTMLP": MNISTMLP},\n)',
                      )

                  if new != src:
                      set_source(cell, new)
                      changed = True

              if changed:
                  path.write_text(json.dumps(nb, indent=1) + '\n')
                  changed_files += 1

          print(f'Structural notebook compatibility fixes applied to {changed_files} notebook(s).')
          PY

      - name: Format and verify environment contracts
        run: |
          python -c "import yaml; yaml.safe_load(open('environment.yml')); print('environment.yml valid')"
          python -m black scripts notebooks
          python -m black --check scripts notebooks

      - name: Execute every notebook from cleared outputs
        run: python scripts/execute_notebooks.py

      - name: Validate rendered notebooks
        run: python scripts/validate_notebooks.py

      - name: Upload rendered notebooks
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ github.ref_name }}-notebooks
          path: notebooks/*.ipynb

      - name: Commit final executed branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: finalize production-grade ANN curriculum with rendered outputs [skip ci]"
          git push
