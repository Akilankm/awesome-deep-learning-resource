name: Execute and validate interactive MNIST ANN curriculum

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notebooks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout orphan branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure Plotly interactive learning cells are present
        run: python .github/enhance_plotly.py

      - name: Install pinned environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${GITHUB_REF_NAME}" == "ann-mnist-pytorch" ]]; then
            grep -v '^torch==' requirements.txt > /tmp/requirements-ci.txt
            pip install -r /tmp/requirements-ci.txt
            pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          else
            pip install -r requirements.txt
          fi

      - name: Verify Conda contract and format notebook code
        shell: bash
        run: |
          python -c "import yaml; yaml.safe_load(open('environment.yml')); print('environment.yml valid')"
          python -m black scripts notebooks .github/enhance_plotly.py
          python -m black --check scripts notebooks .github/enhance_plotly.py

      - name: Execute every notebook from cleared outputs
        run: python scripts/execute_notebooks.py

      - name: Validate rendered notebooks
        run: python scripts/validate_notebooks.py

      - name: Upload rendered notebooks
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ github.ref_name }}-notebooks
          path: notebooks/*.ipynb

      - name: Commit interactive rendered notebooks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md requirements.txt environment.yml notebooks .github/enhance_plotly.py .github/workflows/execute-notebooks.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: render Plotly-enhanced ANN notebooks [skip ci]"
            git push
          fi
