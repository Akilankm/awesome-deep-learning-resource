name: Execute and validate MNIST E2E notebooks

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notebooks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout e2e branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shared dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v -E '^(torch|tensorflow-cpu)==' requirements.txt > /tmp/base.txt
          pip install -r /tmp/base.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install tensorflow-cpu==2.18.0

      - name: Validate Conda contract
        run: python -c "import yaml; yaml.safe_load(open('environment.yml')); print('environment.yml valid')"

      - name: Execute both notebooks from cleared outputs
        run: python scripts/execute_notebooks.py

      - name: Validate complete E2E contract
        run: python scripts/validate_notebooks.py

      - name: Upload rendered notebooks
        uses: actions/upload-artifact@v4
        with:
          name: rendered-e2e-notebooks
          path: notebooks/*.ipynb

      - name: Commit rendered results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "ci: render executed MNIST e2e notebooks [skip ci]"
            git push
          fi
