name: Materialize NLP educational dataset

on:
  push:
    branches:
      - nlp-ready-made-dataset-pedagogy
    paths:
      - .github/workflows/materialize_nlp_dataset.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nlp-ready-made-dataset-pedagogy
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib scikit-learn joblib nbformat

      - name: Execute setup and data-materialization cells only
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          path = Path("nlp/projects/customer_support_intelligence/customer_support_intelligence_end_to_end.ipynb")
          nb = nbformat.read(path, as_version=4)
          scope = {}

          found = False
          for cell in nb.cells:
              if cell.cell_type != "code":
                  continue
              exec(cell.source, scope)
              if "def build_educational_dataset" in cell.source:
                  found = True
                  break

          if not found:
              raise RuntimeError("Dataset generator cell was not found in the pre-refactor notebook.")

          raw = path.parent / "data" / "raw"
          expected = [raw / "support_tickets.csv", raw / "knowledge_base.csv"]
          for f in expected:
              if not f.exists() or f.stat().st_size == 0:
                  raise RuntimeError(f"Expected materialized dataset missing: {f}")
              print(f, f.stat().st_size)
          PY

      - name: Commit ready-made raw dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             nlp/projects/customer_support_intelligence/data/raw/support_tickets.csv             nlp/projects/customer_support_intelligence/data/raw/knowledge_base.csv
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "data: materialize ready-made NLP project dataset"
            git push origin HEAD:nlp-ready-made-dataset-pedagogy
          fi
