<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#ffffff"/><text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Representation Learning: the same samples move as parameters learn</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#444">h = φ(Wx + b) — when W and b change, the hidden coordinates of x change</text><g font-family="Arial"><rect x="60" y="125" width="300" height="390" rx="18" fill="#f7f7f7" stroke="#333" stroke-width="2"/><text x="210" y="160" text-anchor="middle" font-size="22" font-weight="700">Epoch 0</text><circle cx="145" cy="245" r="11" fill="#4c78a8"/><circle cx="185" cy="300" r="11" fill="#4c78a8"/><circle cx="245" cy="225" r="11" fill="#f58518"/><circle cx="270" cy="315" r="11" fill="#f58518"/><circle cx="160" cy="385" r="11" fill="#54a24b"/><circle cx="260" cy="405" r="11" fill="#54a24b"/><text x="210" y="480" text-anchor="middle" font-size="17">classes overlap</text><path d="M390 320 H500" stroke="#333" stroke-width="4" marker-end="url(#a)"/><rect x="450" y="195" width="300" height="250" rx="18" fill="#eef5ff" stroke="#333" stroke-width="2"/><text x="600" y="235" text-anchor="middle" font-size="22" font-weight="700">Training loop</text><text x="600" y="280" text-anchor="middle" font-size="18">prediction → loss</text><text x="600" y="320" text-anchor="middle" font-size="18">loss → gradients</text><text x="600" y="360" text-anchor="middle" font-size="18">gradients → parameter update</text><text x="600" y="400" text-anchor="middle" font-size="18">new W, b → new h</text><path d="M780 320 H890" stroke="#333" stroke-width="4" marker-end="url(#a)"/><rect x="840" y="125" width="300" height="390" rx="18" fill="#f7f7f7" stroke="#333" stroke-width="2"/><text x="990" y="160" text-anchor="middle" font-size="22" font-weight="700">Later epoch</text><circle cx="905" cy="235" r="11" fill="#4c78a8"/><circle cx="930" cy="270" r="11" fill="#4c78a8"/><circle cx="1045" cy="220" r="11" fill="#f58518"/><circle cx="1075" cy="255" r="11" fill="#f58518"/><circle cx="965" cy="405" r="11" fill="#54a24b"/><circle cx="1005" cy="430" r="11" fill="#54a24b"/><text x="990" y="480" text-anchor="middle" font-size="17">learned geometry is easier to separate</text><text x="600" y="580" text-anchor="middle" font-size="19" font-weight="700">Representation learning is not a mysterious extra step.</text><text x="600" y="612" text-anchor="middle" font-size="18">It is the geometric consequence of parameter updates changing the coordinates produced by hidden layers.</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs></svg>