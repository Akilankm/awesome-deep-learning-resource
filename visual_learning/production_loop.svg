<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220"><style>.b{fill:#fff7ed;stroke:#9a3412;stroke-width:2}.t{font:17px Arial;fill:#431407}</style><rect class="b" x="40" y="70" width="160" height="80"/><text class="t" x="120" y="105" text-anchor="middle">Deploy</text><rect class="b" x="260" y="70" width="160" height="80"/><text class="t" x="340" y="105" text-anchor="middle">Monitor</text><rect class="b" x="480" y="70" width="160" height="80"/><text class="t" x="560" y="105" text-anchor="middle">Detect drift</text><rect class="b" x="700" y="70" width="160" height="80"/><text class="t" x="780" y="105" text-anchor="middle">Retrain / rollback</text><text class="t" x="500" y="35" text-anchor="middle">Production is a feedback loop, not a terminal state</text></svg>